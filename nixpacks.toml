# nixpacks.toml — Railway build config
# better-sqlite3 (vara-wallet dep) needs python3 + gcc to compile native bindings.
# Do NOT pin nodejs here — let nixpacks auto-detect; pinning conflicts with the runtime PATH.
[phases.setup]
nixPkgs = ["python3", "gcc", "gnumake"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = []
