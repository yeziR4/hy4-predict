# nixpacks.toml — Railway build config
# Explicitly install nodejs_20 + build tools so better-sqlite3 can compile.
# nodejs_20 is required — without it, npm is not on PATH in the custom setup phase.
[phases.setup]
nixPkgs = ["nodejs_20", "python3", "gcc", "gnumake"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = []
